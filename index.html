<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UnFilteredAI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b0f;
      color: #f4f4f5;
      min-height: 100vh;
    }
    .app { max-width: 960px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 22px 18px 12px; display:flex; justify-content:space-between; align-items:center; }
    .brand { font-size: 20px; font-weight: 800; }
    .model { font-size: 13px; color: #a1a1aa; }
    main { flex: 1; padding: 12px 18px 120px; }
    #messages { display:flex; flex-direction:column; gap:14px; }
    .msg { padding: 14px 16px; border-radius: 16px; white-space: pre-wrap; line-height: 1.55; overflow-wrap:anywhere; }
    .user { background:#18181f; margin-left: 12%; }
    .assistant { background:#101014; border:1px solid #25252d; margin-right: 8%; }
    .role { font-size: 11px; color:#71717a; margin-bottom:6px; text-transform:uppercase; letter-spacing:.08em; }
    .composer {
      position: fixed; left: 50%; bottom: 18px; transform:translateX(-50%);
      width:min(924px, calc(100% - 36px));
      display:flex; gap:10px; padding:10px;
      background:rgba(18,18,23,.95); border:1px solid #292932; border-radius:18px;
      backdrop-filter: blur(12px);
    }
    textarea {
      flex:1; resize:none; min-height:48px; max-height:180px; border:0; outline:0;
      background:transparent; color:#fff; font:inherit; padding:11px 8px;
    }
    button {
      align-self:flex-end; border:0; border-radius:12px; padding:12px 17px;
      background:#fff; color:#09090b; font-weight:700; cursor:pointer;
    }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .empty { color:#71717a; text-align:center; padding-top:24vh; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">UnFilteredAI</div>
    <div class="model">gpt-5.6-luna · 35K</div>
  </header>

  <main>
    <div id="messages">
      <div class="empty" id="empty">Напиши сообщение, чтобы начать.</div>
    </div>
  </main>

  <div class="composer">
    <textarea id="input" placeholder="Сообщение..." rows="1"></textarea>
    <button id="send">Отправить</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const emptyEl = document.getElementById("empty");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  const history = [];

  function addMessage(role, text = "") {
    emptyEl?.remove();
    const box = document.createElement("div");
    box.className = "msg " + role;
    const label = document.createElement("div");
    label.className = "role";
    label.textContent = role === "user" ? "Вы" : "UnFilteredAI";
    const content = document.createElement("div");
    content.textContent = text;
    box.append(label, content);
    messagesEl.appendChild(box);
    return content;
  }

  async function streamChat() {
    const prompt = input.value.trim();
    if (!prompt || send.disabled) return;

    input.value = "";
    input.style.height = "auto";
    history.push({ role: "user", content: prompt });
    addMessage("user", prompt);
    const output = addMessage("assistant", "");
    send.disabled = true;

    try {
      const response = await fetch("/v1/chat/completions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "gpt-5.6-luna",
          messages: history,
          stream: true,
          max_tokens: 35000
        })
      });

      if (!response.ok) {
        throw new Error(await response.text());
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let full = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const events = buffer.split("\n\n");
        buffer = events.pop() || "";

        for (const event of events) {
          for (const line of event.split("\n")) {
            if (!line.startsWith("data:")) continue;
            const data = line.slice(5).trim();
            if (!data || data === "[DONE]") continue;

            try {
              const json = JSON.parse(data);
              const delta = json.choices?.[0]?.delta?.content;
              if (typeof delta === "string") {
                full += delta;
                output.textContent = full;
                window.scrollTo(0, document.body.scrollHeight);
              }
            } catch (_) {}
          }
        }
      }

      history.push({ role: "assistant", content: full });
    } catch (err) {
      output.textContent = "Ошибка: " + (err?.message || "не удалось получить ответ");
      history.pop();
    } finally {
      send.disabled = false;
      input.focus();
    }
  }

  send.addEventListener("click", streamChat);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      streamChat();
    }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
  });
</script>
</body>
</html>
